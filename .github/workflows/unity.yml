name: Unity (trusted manual runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editmode:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, unity]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: EditMode tests with locally licensed Unity
        shell: powershell
        run: ./test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-results
          path: |
            Logs/editmode-results.xml
            Logs/unity-tests.log
